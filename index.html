<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社會期中闖關島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* 版面概念：黑板綠＋粉筆色的「闖關護照」。地圖是一條校園小路，每一站蓋一枚徽章；魔王關打贏換公仔，扭蛋幣轉扭蛋。 */
:root{
  --bg:#eef3ef; --card:#ffffff; --ink:#1e2c28; --muted:#5b6d67; --line:#cfdcd5;
  --board:#24493f; --board-ink:#f4f1e4;
  --yellow:#e9a91c; --yellow-soft:#fdf0cc;
  --red:#d9533c; --red-soft:#fbe3dd;
  --blue:#2f78bd; --blue-soft:#dfeaf7;
  --ok:#2c9a5b; --ok-soft:#dcf2e5;
  --u1:#2f78bd; --u1-soft:#dfeaf7;
  --u2:#d9733c; --u2-soft:#fbe8dc;
  --gold:#d79b12;
  --font:"LXGW WenKai TC","TW-MOE-Std-Kai","教育部標準楷書","DFKai-SB","BiauKai","標楷體","Kaiti TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --shadow:0 3px 0 var(--line);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111917; --card:#1a2421; --ink:#e7efea; --muted:#9db0a9; --line:#2d3b37;
  --board:#2f5e52; --board-ink:#f4f1e4;
  --yellow:#f2c04f; --yellow-soft:#3b3219; --red:#ff7b63; --red-soft:#43231d;
  --blue:#76aef0; --blue-soft:#1d2f45; --ok:#5ccf8d; --ok-soft:#183626;
  --u1:#76aef0; --u1-soft:#1d2f45; --u2:#f39a63; --u2-soft:#3d2719; --gold:#f2c04f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111917; --card:#1a2421; --ink:#e7efea; --muted:#9db0a9; --line:#2d3b37;
  --board:#2f5e52; --board-ink:#f4f1e4;
  --yellow:#f2c04f; --yellow-soft:#3b3219; --red:#ff7b63; --red-soft:#43231d;
  --blue:#76aef0; --blue-soft:#1d2f45; --ok:#5ccf8d; --ok-soft:#183626;
  --u1:#76aef0; --u1-soft:#1d2f45; --u2:#f39a63; --u2-soft:#3d2719; --gold:#f2c04f; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.15rem;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 4rem;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
.wrap{max-width:60rem;margin:0 auto}

/* 上方工具列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.5rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-in{max-width:60rem;margin:0 auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.bar h2{font-size:1.25rem;flex:1;min-width:8rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.95rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.15rem .7rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip b{font-size:1.05rem}
.chip.coin b{color:var(--gold)}
button.chip:hover{border-color:var(--ink)}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.2rem .7rem;font-size:.95rem}

/* 通用按鈕 */
.btn{font-size:1.1rem;background:var(--board);color:var(--board-ink);border:0;border-radius:12px;padding:.55rem 1.3rem;box-shadow:0 3px 0 color-mix(in srgb,var(--board) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--board) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn.gold{background:var(--yellow);color:#2a1d00;box-shadow:0 3px 0 color-mix(in srgb,var(--yellow) 60%,#000)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.center{justify-content:center;text-align:center}

/* 登入 */
.login{padding-block:2rem;display:grid;gap:1.4rem;justify-items:center;text-align:center}
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:1.6rem 1.4rem;width:100%;border:8px solid #8a6a42;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.board .eyebrow{font-size:.9rem;letter-spacing:.2em;opacity:.8}
.board h1{font-size:clamp(2.2rem,8vw,3.6rem);letter-spacing:.06em}
.board p{opacity:.9}
.chalk-line{height:3px;width:7rem;margin:.6rem auto;background:var(--yellow);border-radius:3px}
.figrow{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.figrow svg{width:clamp(64px,16vw,96px);height:auto}
.seatpad{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;width:100%;max-width:24rem}
.seat{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:1.3rem;font-variant-numeric:tabular-nums;position:relative}
.seat.has{border-color:var(--board);background:color-mix(in srgb,var(--board) 12%,var(--card))}
.seat.has::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.seat:hover{border-color:var(--ink)}
.login .hint{color:var(--muted);font-size:.95rem}

/* 地圖 */
.hello{padding-block:1.2rem .6rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.hello h1{font-size:clamp(1.6rem,5vw,2.2rem);flex:1;min-width:12rem}
.hello .sub{color:var(--muted);font-size:1rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.6rem 0 1.2rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem;display:grid;gap:.1rem;text-align:left;box-shadow:var(--shadow)}
.stat small{color:var(--muted);font-size:.85rem}
.stat b{font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .bar2{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.stat .bar2 i{display:block;height:100%;background:var(--ok)}
button.stat:hover{border-color:var(--ink)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(20rem,1fr));gap:1.2rem;align-items:start}
.unit{--c:var(--u1);--cs:var(--u1-soft);background:var(--card);border:2px solid var(--c);border-radius:20px;overflow:hidden}
.unit.u2{--c:var(--u2);--cs:var(--u2-soft)}
.unit-head{background:var(--c);color:var(--card);padding:.8rem 1rem;display:grid;gap:.1rem}
.unit-head small{font-size:.85rem;letter-spacing:.15em;opacity:.9}
.unit-head h2{font-size:1.6rem}
.unit-body{padding:.6rem .8rem 1rem;display:grid;gap:.4rem}
.lesson-title{font-size:1rem;color:var(--c);font-weight:700;margin-top:.6rem;display:flex;align-items:center;gap:.5rem}
.lesson-title::after{content:"";flex:1;height:2px;background:var(--cs)}
.trail{display:grid;gap:.45rem;position:relative;padding-left:1.6rem}
.trail::before{content:"";position:absolute;left:.7rem;top:.8rem;bottom:.8rem;border-left:3px dashed var(--cs)}
.node{position:relative;display:grid;grid-template-columns:3rem 1fr auto;gap:.7rem;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.4rem .7rem}
.node::before{content:"";position:absolute;left:-1.25rem;top:50%;width:.8rem;height:.8rem;border-radius:50%;background:var(--card);border:3px solid var(--cs);transform:translateY(-50%)}
.node.done::before{background:var(--c);border-color:var(--c)}
.node .medal{width:3rem;height:3rem}
.node b{font-size:1.15rem;display:block;line-height:1.3}
.node small{color:var(--muted);font-size:.85rem}
.node .stars{font-size:1rem;letter-spacing:.05em;color:var(--gold);white-space:nowrap}
.node .stars .off{color:var(--line)}
.node:not(:disabled):hover{border-color:var(--c)}
.node.now{border-color:var(--c);box-shadow:0 0 0 4px var(--cs)}
.node.now .go{font-size:.85rem;background:var(--c);color:var(--card);border-radius:99px;padding:.05rem .6rem;white-space:nowrap}
.node:disabled{cursor:default;opacity:.55}
.node:disabled .medal{filter:grayscale(1)}
.bossnode{margin-top:.8rem;display:grid;grid-template-columns:4.5rem 1fr;gap:.8rem;align-items:center;text-align:left;border-radius:16px;padding:.6rem .8rem;background:var(--board);color:var(--board-ink);border:0}
.bossnode svg{width:4.5rem;height:auto}
.bossnode b{font-size:1.25rem;display:block}
.bossnode small{opacity:.85;font-size:.9rem;display:block}
.bossnode:disabled{opacity:.6;cursor:default}
.bossnode.cleared{background:color-mix(in srgb,var(--ok) 80%,#000)}
.final{margin-top:1.4rem}
.final .bossnode{margin:0;grid-template-columns:5rem 1fr}
.final .bossnode svg{width:5rem}

/* 小節頁 */
.step-tabs{display:flex;gap:.4rem;margin:1rem 0 .8rem}
.step-tabs span{font-size:.9rem;padding:.1rem .8rem;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.step-tabs span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:1.2rem 1.2rem 1.4rem;display:grid;gap:.8rem;min-height:15rem;position:relative}
.kcard .kno{position:absolute;top:.6rem;right:.9rem;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.kcard h3{font-size:clamp(1.4rem,5vw,1.8rem);color:var(--board);display:flex;gap:.5rem;align-items:center}
:root[data-theme="dark"] .kcard h3{color:var(--yellow)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kcard h3{color:var(--yellow)}}
.kcard ul{margin:0;padding-left:1.3rem;display:grid;gap:.55rem}
.kcard li{font-size:clamp(1.2rem,4.3vw,1.45rem);line-height:1.75}
.kcard li::marker{color:var(--yellow)}
.kcard .tip{background:var(--yellow-soft);border-radius:10px;padding:.5rem .8rem;font-size:1.05rem}
.blank{display:inline-block;min-width:3.2em;border:0;border-bottom:3px solid var(--red);background:var(--red-soft);color:transparent;border-radius:6px 6px 0 0;padding:0 .3em;margin:0 .1em;line-height:1.45;font-size:inherit;font-weight:700;position:relative}
.blank::after{content:"點我";position:absolute;inset:0;display:grid;place-items:center;color:var(--red);font-size:.6em;font-weight:400;opacity:.8}
.blank.open{color:var(--red);background:transparent}
.blank.open::after{content:none}
.dots{display:flex;gap:.35rem;justify-content:center;margin:.8rem 0}
.dots i{width:.6rem;height:.6rem;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--board)}
.dots i.seen{background:color-mix(in srgb,var(--board) 45%,var(--line))}
.nav{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:.4rem}

/* 題目 */
.qhead{display:flex;align-items:center;gap:.6rem;margin:1rem 0 .6rem;flex-wrap:wrap}
.qhead .prog{flex:1;min-width:8rem;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.qhead .prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qhead .count{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hearts{font-size:1.1rem;letter-spacing:.1em}
.qcard{background:var(--card);border:2px solid var(--board);border-radius:18px;padding:1.1rem 1.1rem 1.3rem;display:grid;gap:.9rem}
.qtype{justify-self:start;font-size:.8rem;letter-spacing:.12em;background:var(--board);color:var(--board-ink);border-radius:6px;padding:.05rem .5rem}
.qtext{font-size:clamp(1.3rem,4.6vw,1.65rem);line-height:1.7;font-weight:700}
.opts{display:grid;gap:.55rem}
.opt{display:flex;gap:.7rem;align-items:center;text-align:left;font-size:clamp(1.15rem,4.2vw,1.4rem);line-height:1.5;padding:.6rem .9rem;border-radius:14px;border:2px solid var(--line);background:var(--card);min-height:3.4rem}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:1rem;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--board)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:var(--card)}
.opt.dim{opacity:.5}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.tf .opt{justify-content:center;font-size:clamp(1.6rem,6vw,2.2rem);min-height:5rem}
.sortbox{display:grid;gap:.5rem}
.slots{display:grid;gap:.4rem}
.slot{display:flex;gap:.6rem;align-items:center;min-height:3rem;border:2px dashed var(--line);border-radius:12px;padding:.3rem .7rem;font-size:clamp(1.05rem,4vw,1.3rem)}
.slot .n{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--board);color:var(--board-ink);display:grid;place-items:center;font-size:.95rem}
.slot.filled{border-style:solid;border-color:var(--board)}
.slot.right{border-color:var(--ok);background:var(--ok-soft)}
.slot.wrong{border-color:var(--red);background:var(--red-soft)}
.pool{display:flex;flex-wrap:wrap;gap:.5rem}
.pool .opt{min-height:auto;padding:.4rem .8rem}
.cls{display:grid;gap:.6rem}
.cls-row{display:grid;gap:.35rem;border:2px solid var(--line);border-radius:14px;padding:.5rem .7rem}
.cls-row .it{font-size:clamp(1.1rem,4.2vw,1.35rem);font-weight:700}
.cls-row .cb{display:flex;flex-wrap:wrap;gap:.4rem}
.cls-row .cb button{font-size:1rem;border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:.15rem .8rem}
.cls-row .cb button.sel{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.cls-row.right{border-color:var(--ok);background:var(--ok-soft)}
.cls-row.wrong{border-color:var(--red);background:var(--red-soft)}
.cls-row .fix{font-size:.95rem;color:var(--ok)}
.fb{border-radius:14px;padding:.8rem 1rem;display:grid;gap:.2rem;animation:pop .25s ease-out}
.fb.good{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.bad{background:var(--red-soft);border:2px solid var(--red)}
.fb h4{margin:0;font-size:1.3rem}
.fb.good h4{color:var(--ok)}
.fb.bad h4{color:var(--red)}
.fb p{font-size:1.1rem}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

/* 魔王 */
.arena{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;background:var(--board);color:var(--board-ink);border-radius:18px;padding:.8rem 1rem;margin-top:1rem}
.arena svg{width:clamp(80px,22vw,120px);height:auto}
.arena .hp{height:16px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden;margin-top:.3rem}
.arena .hp i{display:block;height:100%;background:linear-gradient(90deg,#ff7b63,#f2c04f);transition:width .5s}
.arena b{font-size:1.3rem}
.arena small{opacity:.85;font-size:.9rem}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(8px) rotate(4deg)}}
.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px)}}

/* 結果 */
.result{display:grid;gap:1rem;justify-items:center;text-align:center;padding-top:1.2rem}
.result h2{font-size:clamp(1.8rem,6vw,2.4rem)}
.bigstars{font-size:clamp(2.6rem,10vw,3.6rem);letter-spacing:.1em;line-height:1}
.bigstars span{display:inline-block;color:var(--line)}
.bigstars span.on{color:var(--gold);animation:starin .5s cubic-bezier(.3,1.6,.6,1) both}
.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.award{background:var(--card);border:2px solid var(--yellow);border-radius:18px;padding:1rem 1.2rem;display:grid;gap:.4rem;justify-items:center;width:min(100%,24rem)}
.award svg{width:7rem;height:auto;animation:starin .6s cubic-bezier(.3,1.6,.6,1) both .2s}
.award .lbl{font-size:.85rem;letter-spacing:.15em;color:var(--muted)}
.award b{font-size:1.4rem}
.coins-earn{font-size:1.15rem;color:var(--gold);font-weight:700}
.review{width:100%;text-align:left;display:grid;gap:.5rem}
.review h3{font-size:1.25rem}
.ritem{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:10px;padding:.6rem .9rem;font-size:1.05rem}
.ritem .ans{color:var(--ok);font-weight:700}

/* 收藏 */
.shelf-head{padding-block:1.2rem .4rem;display:grid;gap:.3rem}
.shelf-head h1{font-size:clamp(1.7rem,5vw,2.2rem)}
.shelf-head p{color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.7rem}
.badge{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.7rem .5rem;display:grid;justify-items:center;gap:.2rem;text-align:center}
.badge svg{width:4.2rem;height:4.2rem}
.badge b{font-size:1rem;line-height:1.35}
.badge small{font-size:.8rem;color:var(--muted)}
.badge.off svg{filter:grayscale(1);opacity:.35}
.badge.off b{color:var(--muted)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.8rem}
.fig{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.6rem .5rem .7rem;display:grid;justify-items:center;gap:.1rem;text-align:center;position:relative}
.fig svg{width:100%;max-width:7.5rem;height:auto}
.fig b{font-size:1.05rem}
.fig small{font-size:.8rem;color:var(--muted)}
.rar{font-size:.75rem;letter-spacing:.1em;border-radius:99px;padding:0 .5rem;color:var(--card);background:var(--muted)}
.rar.r2{background:var(--blue)}
.rar.r3{background:var(--gold);color:#2a1d00}
.fig .cnt{position:absolute;top:.4rem;right:.5rem;font-size:.8rem;background:var(--yellow-soft);border-radius:99px;padding:0 .45rem}
.fig.off svg{opacity:.9}
.secttl{font-size:1.25rem;margin:1.4rem 0 .6rem;display:flex;gap:.5rem;align-items:center}
.secttl::after{content:"";flex:1;height:2px;background:var(--line)}

/* 扭蛋機 */
.gacha{display:grid;gap:1rem;justify-items:center;text-align:center;padding-top:1rem}
.machine{width:min(18rem,80vw);height:auto}
.machine .knob{transform-origin:100px 224px;transition:transform .8s cubic-bezier(.5,1.8,.5,1)}
.machine.spin .knob{transform:rotate(360deg)}
.machine.spin .balls{animation:jiggle .8s}
@keyframes jiggle{25%{transform:translate(3px,-4px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,-2px)}}
.capsule-open{display:grid;gap:.4rem;justify-items:center;background:var(--card);border:2px solid var(--yellow);border-radius:20px;padding:1rem 1.4rem;width:min(100%,22rem)}
.capsule-open svg{width:9rem;height:auto;animation:starin .6s cubic-bezier(.3,1.6,.6,1) both}
.capsule-open b{font-size:1.5rem}
.gacha .note{color:var(--muted);font-size:.95rem;max-width:30rem}

/* 確認視窗 */
.modal{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 50%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--card);border-radius:18px;padding:1.2rem 1.3rem;display:grid;gap:.8rem;max-width:24rem;width:100%;text-align:center}
.modal-box input{font:inherit;font-size:1.2rem;padding:.45rem .7rem;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.foot{margin-top:2.5rem;text-align:center;color:var(--muted);font-size:.85rem;display:grid;gap:.4rem;justify-items:center}

@media (max-width:30rem){
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat b{font-size:1.3rem}
  .node{grid-template-columns:2.6rem 1fr auto}
  .node .medal{width:2.6rem;height:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

function figSVG(id, locked){
  const f = FIGS[id]; if(!f) return '';
  // 繪圖 AI 產生的公仔圖（figs 資料夾）；還沒得到的顯示剪影
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${locked?'還沒得到的公仔':f.n}"><image href="${FIGIMG[id]}" x="0" y="0" width="120" height="120" ${locked?'style="filter:brightness(0);opacity:.2"':''}/>${locked?'<text x="60" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="var(--muted)" font-family="sans-serif">?</text>':''}</svg>`;
  const ol = '#3a2c27';
  const body = locked ? 'var(--line)' : f.body;
  const stroke = locked ? 'var(--muted)' : ol;
  const sw = 3;
  let s = `<svg viewBox="0 0 120 140" role="img" aria-label="${locked?'還沒得到的公仔':f.n}"><ellipse cx="60" cy="130" rx="38" ry="7" fill="${locked?'var(--line)':'rgba(0,0,0,.15)'}"/>`;
  // 鬃毛
  if(f.mane && !locked) s += `<circle cx="60" cy="72" r="50" fill="${f.mane}" stroke="${ol}" stroke-width="${sw}"/>`;
  // 耳朵
  const ec = locked ? 'var(--line)' : (f.earc || f.body);
  const E = {
    cat:`<path d="M30 52 L34 18 L54 40 Z" /><path d="M90 52 L86 18 L66 40 Z" />`,
    tuft:`<path d="M30 50 L28 22 L50 38 Z" /><path d="M90 50 L92 22 L70 38 Z" />`,
    bear:`<circle cx="32" cy="40" r="13"/><circle cx="88" cy="40" r="13"/>`,
    dog:`<ellipse cx="26" cy="62" rx="11" ry="20" transform="rotate(18 26 62)"/><ellipse cx="94" cy="62" rx="11" ry="20" transform="rotate(-18 94 62)"/>`,
    bunny:`<ellipse cx="44" cy="20" rx="9" ry="24"/><ellipse cx="76" cy="20" rx="9" ry="24"/>`,
    crest:`<path d="M52 36 Q50 16 60 22 Q66 10 70 24 Q80 18 72 38 Z"/>`,
    horn:`<path d="M36 44 L30 14 L50 36 Z"/><path d="M84 44 L90 14 L70 36 Z"/>`,
    antenna:`<path d="M48 36 L42 14" fill="none"/><path d="M72 36 L78 14" fill="none"/><circle cx="42" cy="12" r="5"/><circle cx="78" cy="12" r="5"/>`
  };
  if(E[f.ears]) s += `<g fill="${ec}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round">${E[f.ears]}</g>`;
  // 身體
  const B = {
    round:`<circle cx="60" cy="78" r="44"/>`,
    tall:`<rect x="24" y="30" width="72" height="96" rx="32"/>`,
    square:`<rect x="18" y="36" width="84" height="86" rx="22"/>`
  };
  s += `<g fill="${body}" stroke="${stroke}" stroke-width="${sw}">${B[f.shape]}</g>`;
  if(locked){
    s += `<text x="60" y="94" text-anchor="middle" font-size="44" font-weight="700" fill="var(--muted)" font-family="sans-serif">?</text></svg>`;
    return s;
  }
  if(f.belly) s += `<ellipse cx="60" cy="98" rx="26" ry="20" fill="${f.belly}"/>`;
  // 臉
  const ey = f.shape==='tall' ? 66 : 70;
  if(f.mood==='angry'){
    s += `<path d="M36 ${ey-12} L54 ${ey-5}" stroke="${ol}" stroke-width="4" stroke-linecap="round"/><path d="M84 ${ey-12} L66 ${ey-5}" stroke="${ol}" stroke-width="4" stroke-linecap="round"/>`;
    s += `<circle cx="46" cy="${ey+2}" r="5" fill="${ol}"/><circle cx="74" cy="${ey+2}" r="5" fill="${ol}"/>`;
    s += `<path d="M48 ${ey+22} Q60 ${ey+12} 72 ${ey+22}" fill="none" stroke="${ol}" stroke-width="3.5" stroke-linecap="round"/>`;
    s += `<path d="M52 ${ey+16} l3 5 l3 -5" fill="#fff" stroke="${ol}" stroke-width="1.5"/>`;
  } else if(f.mood==='dizzy'){
    s += `<path d="M40 ${ey} a6 6 0 1 1 6 6 a3 3 0 1 1 -3 -3" fill="none" stroke="${ol}" stroke-width="3"/><path d="M68 ${ey} a6 6 0 1 1 6 6 a3 3 0 1 1 -3 -3" fill="none" stroke="${ol}" stroke-width="3"/>`;
    s += `<path d="M48 ${ey+20} q4 -4 8 0 q4 4 8 0 q4 -4 8 0" fill="none" stroke="${ol}" stroke-width="3" stroke-linecap="round"/>`;
  } else {
    s += `<circle cx="45" cy="${ey}" r="6" fill="${ol}"/><circle cx="75" cy="${ey}" r="6" fill="${ol}"/>`;
    s += `<circle cx="47" cy="${ey-2}" r="2" fill="#fff"/><circle cx="77" cy="${ey-2}" r="2" fill="#fff"/>`;
    s += `<ellipse cx="35" cy="${ey+12}" rx="7" ry="4" fill="#f59a9a" opacity=".7"/><ellipse cx="85" cy="${ey+12}" rx="7" ry="4" fill="#f59a9a" opacity=".7"/>`;
    s += `<path d="M53 ${ey+11} Q60 ${ey+18} 67 ${ey+11}" fill="none" stroke="${ol}" stroke-width="3" stroke-linecap="round"/>`;
  }
  // 帽子
  const hc = f.hatc || '#3a2c27';
  const top = f.shape==='round' ? 36 : (f.shape==='tall'?32:38);
  if(f.hat==='cap') s += `<path d="M34 ${top+8} Q60 ${top-18} 86 ${top+8} Z" fill="${hc}" stroke="${ol}" stroke-width="${sw}"/><path d="M80 ${top+6} L102 ${top+10}" stroke="${ol}" stroke-width="5" stroke-linecap="round"/>`;
  if(f.hat==='grad') s += `<path d="M28 ${top-2} L60 ${top-16} L92 ${top-2} L60 ${top+10} Z" fill="#2f2a3a" stroke="${ol}" stroke-width="2"/><rect x="46" y="${top+2}" width="28" height="10" fill="#2f2a3a"/><path d="M88 ${top-2} L90 ${top+18}" stroke="#f2c04f" stroke-width="3"/><circle cx="90" cy="${top+20}" r="3" fill="#f2c04f"/>`;
  if(f.hat==='crown') s += `<path d="M38 ${top+6} L40 ${top-16} L50 ${top-4} L60 ${top-20} L70 ${top-4} L80 ${top-16} L82 ${top+6} Z" fill="#f2c04f" stroke="${ol}" stroke-width="${sw}" stroke-linejoin="round"/><circle cx="60" cy="${top-2}" r="3.5" fill="#e0644a"/>`;
  // 道具
  if(f.item) s += `<text x="98" y="118" text-anchor="middle" font-size="30">${f.item}</text>`;
  if(f.r===2) s += `<text x="16" y="30" font-size="18">✨</text>`;
  if(f.r===3) s += `<text x="12" y="30" font-size="20">🌟</text><text x="100" y="40" font-size="14">✨</text>`;
  return s + '</svg>';
}

function medalSVG(icon, color, stars){
  // 徽章：外圈鋸齒＋緞帶，中間放關卡圖示
  const c = `var(--${color})`;
  let teeth = '';
  for(let i=0;i<16;i++){ const a=i*Math.PI/8; teeth += `${50+46*Math.cos(a)},${46+46*Math.sin(a)} ${50+40*Math.cos(a+Math.PI/16)},${46+40*Math.sin(a+Math.PI/16)} `; }
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M30 70 L22 98 L36 90 L44 100 L50 74 Z" fill="${c}" opacity=".85"/><path d="M70 70 L78 98 L64 90 L56 100 L50 74 Z" fill="${c}" opacity=".85"/>
    <polygon points="${teeth}" fill="${c}"/>
    <circle cx="50" cy="46" r="33" fill="var(--card)" stroke="${c}" stroke-width="3"/>
    <text x="50" y="58" text-anchor="middle" font-size="32">${icon}</text>
    ${stars>=3?'<circle cx="50" cy="46" r="38" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="4 4"/>':''}
  </svg>`;
}

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* 音效 */
let actx = null;
function beep(kind){
  if(!P() || !P().sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = {good:[660,880], bad:[260,200], win:[523,659,784,1047], coin:[988,1319], click:[600]}[kind] || [600];
    notes.forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = kind==='bad' ? 'triangle' : 'sine'; o.frequency.value=f;
      const t=actx.currentTime + i*0.11;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.2);
    });
  }catch(e){}
}

/* 彩帶 */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxOn = false;
function confetti(n=120){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth*devicePixelRatio; fx.height = innerHeight*devicePixelRatio;
  const cols = ['#e9a91c','#d9533c','#2f78bd','#2c9a5b','#8a6cc8','#f08a5d'];
  for(let i=0;i<n;i++) parts.push({x:Math.random()*fx.width, y:-20-Math.random()*fx.height*0.3, vx:(Math.random()-.5)*4, vy:2+Math.random()*4, s:(6+Math.random()*8)*devicePixelRatio, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[i%cols.length]});
  if(!fxOn){ fxOn=true; requestAnimationFrame(tick); }
}
function tick(){
  fctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy*devicePixelRatio; p.r+=p.vr; fctx.save(); fctx.translate(p.x,p.y); fctx.rotate(p.r); fctx.fillStyle=p.c; fctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); fctx.restore(); });
  parts = parts.filter(p=>p.y < fx.height+40);
  if(parts.length) requestAnimationFrame(tick); else { fxOn=false; fctx.clearRect(0,0,fx.width,fx.height); }
}

      ${last?`<button class="btn gold" id="go">開始小測驗 →</button>`:`<button class="btn" id="next">下一張 →</button>`}
    </div>
    <p class="foot" style="margin-top:1rem">先想一想紅色格子裡是什麼，再點開看答案。</p>
  </div>`;
  bindTop(viewMap);
  app.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{ b.classList.add('open'); beep('click'); });
  $('#all').onclick = ()=>app.querySelectorAll('.blank').forEach(b=>b.classList.add('open'));
  $('#prev').onclick = ()=>viewCards(id,i-1);
  if(last) $('#go').onclick = ()=>startQuiz({kind:'sec', id, unit:u.id, qs: pickQs(s.quiz,5), title:`${s.icon} ${s.name} 小測驗`});
  else $('#next').onclick = ()=>viewCards(id,i+1);
}

/* ===== 出題 ===== */
function prepQ(q){
  q = Object.assign({}, q);
  if(q.t==='mc'){
    const keep = q.o.some(x=>/以上/.test(x));
    const idx = keep ? q.o.map((_,i)=>i) : shuffle(q.o.map((_,i)=>i));
    q.o2 = idx.map(i=>q.o[i]); q.a2 = idx.indexOf(q.a);
  }
  if(q.t==='cls'){
    const k = q.pick || 4;
    // 盡量每一類都抽到
    let its = shuffle(q.items);
    const chosen = [];
    q.cats.forEach((_,ci)=>{ const f = its.find(x=>x[1]===ci && !chosen.includes(x)); if(f && chosen.length<k) chosen.push(f); });
    its.forEach(x=>{ if(chosen.length<k && !chosen.includes(x)) chosen.push(x); });
    q.its = shuffle(chosen);
  }
  if(q.t==='sort') q.pool = (()=>{ let s; do{ s=shuffle(q.items); }while(s.join()===q.items.join()); return s; })();
  return q;
}
function pickQs(pool, n){ return shuffle(pool).slice(0,n).map(prepQ); }
function bossQs(uid){
  if(uid==='final'){
    const per = UNITS.flatMap(u=>allSecs(u).map(s=>shuffle(s.quiz)[0]));
    const rest = shuffle(UNITS.flatMap(u=>u.extra));
    return shuffle(per.concat(rest.slice(0,2))).map(prepQ);
  }
  const u = UNITS.find(x=>x.id===uid);
  const used = new Set();
  const per = allSecs(u).map(s=>{ const q=shuffle(s.quiz)[0]; used.add(q); return q; });
  const rest = shuffle(allSecs(u).flatMap(s=>s.quiz).filter(q=>!used.has(q)).concat(u.extra));
  return shuffle(per.concat(rest.slice(0,15-per.length))).map(prepQ);
}

  if(q.t==='cls') body = `<div class="cls">${q.its.map((it,k)=>`<div class="cls-row" data-k="${k}"><span class="it">${esc(it[0])}</span>
    <span class="cb">${q.cats.map((c,ci)=>`<button data-c="${ci}">${esc(c)}</button>`).join('')}</span></div>`).join('')}
    <div class="row"><button class="btn" id="check" disabled>送出答案</button></div></div>`;
  const arena = Q.kind==='boss' ? `<div class="arena"><div id="mon">${figSVG(Q.boss.fig)}</div><div><b>${esc(Q.boss.name)}</b>
     <div class="hp"><i id="hp" style="width:${100 - Q.right/Math.ceil(n*0.8)*100}%"></i></div><small>還要再答對 ${Math.max(0,Math.ceil(n*0.8)-Q.right)} 題就能打敗牠</small></div></div>` : '';
  app.innerHTML = topbar(Q.title, '離開') + `<div class="wrap">${arena}
    <div class="qhead"><span class="count">第 ${Q.i+1} / ${n} 題</span><span class="prog"><i style="width:${Q.i/n*100}%"></i></span><span class="count">答對 ${Q.right}</span></div>
    <div class="qcard"><span class="qtype">${typeName}</span><p class="qtext">${esc(q.q)}</p>${body}<div id="fb"></div></div>
  </div>`;
  bindTop(()=>modal(`<h3 style="font-size:1.3rem">要離開這次測驗嗎？</h3><p>這次的作答不會記分。</p><div class="row center"><button class="btn ghost" id="no">繼續作答</button><button class="btn" id="yes">離開</button></div>`, box=>{
    box.querySelector('#no').onclick=closeModal; box.querySelector('#yes').onclick=()=>{closeModal(); viewMap();};
  }));
  $('#tbCoin').disabled = true;

  if(q.t==='tf' || q.t==='mc'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const v = +b.dataset.v;
      const ok = q.t==='tf' ? (v===1)===q.a : v===q.a2;
      app.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; const xv=+x.dataset.v;
        const isAns = q.t==='tf' ? (xv===1)===q.a : xv===q.a2;
        if(isAns) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); else x.classList.add('dim'); });
      const ansText = q.t==='tf' ? (q.a?'⭕ 對':'❌ 錯') : `${'①②③④'[q.a2]} ${q.o2[q.a2]}`;
      answer(ok, ansText);
    });
  }
  if(q.t==='sort'){
    let order = [];
    const paint = ()=>{
      app.querySelectorAll('.slot').forEach((sl,k)=>{ sl.querySelector('.tx').textContent = order[k]!=null ? q.pool[order[k]] : ''; sl.classList.toggle('filled', order[k]!=null); });

      app.querySelectorAll('.slot').forEach((sl,k)=>{ const r = got[k]===q.items[k]; ok = ok && r; sl.classList.add(r?'right':'wrong'); });
      $('#check').disabled = true; $('#redo').disabled = true;
      answer(ok, q.items.map((t,k)=>`${k+1}. ${t}`).join('　'));
    };
  }
  if(q.t==='cls'){
    const pick = {};
    app.querySelectorAll('.cls-row').forEach(row=>{

      });
    });

      app.querySelectorAll('.cls-row').forEach(row=>{

        if(!r) row.insertAdjacentHTML('beforeend', `<span class="fix">正確答案：${esc(q.cats[it[1]])}</span>`);
      });
      $('#check').disabled = true;
      answer(ok, q.its.map(it=>`${it[0]} → ${q.cats[it[1]]}`).join('；'));
    };
  }
}

function answer(ok, ansText){
  const q = Q.qs[Q.i];
  if(ok){ Q.right++; beep('good'); } else { Q.wrong.push({q:q.q, a:ansText, e:q.e}); beep('bad'); }
  const cheers = ['答對了！','好厲害！','完全正確！','太棒了！','就是這樣！'];
  const last = Q.i === Q.qs.length-1;
  $('#fb').innerHTML = `<div class="fb ${ok?'good':'bad'}"><h4>${ok?cheers[Math.floor(Math.random()*cheers.length)]:'差一點點！'}</h4>
    ${ok? (q.e?`<p>${esc(q.e)}</p>`:'') : `<p>正確答案：<b>${esc(ansText)}</b></p>${q.e?`<p>${esc(q.e)}</p>`:''}`}
    <div class="row" style="margin-top:.4rem"><button class="btn" id="nx">${last?'看結果':'下一題 →'}</button></div></div>`;
  if(Q.kind==='boss'){
    const need = Math.ceil(Q.qs.length*0.8);
    const hp = $('#hp'); if(hp) hp.style.width = Math.max(0,100 - Q.right/need*100)+'%';
    const mon = $('#mon'); if(mon){ mon.classList.remove('shake','hop'); void mon.offsetWidth; mon.classList.add(ok?'shake':'hop'); }
  }
  $('#nx').onclick = ()=>{ if(last) finishQuiz(); else { Q.i++; viewQ(); } };
  $('#nx').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ===== 結算 ===== */
function finishQuiz(){
  scrollTop();
  const p = P(), n = Q.qs.length, st = starsFor(Q.right, n);
  let prev, coinsGot = 0, award = '';
  if(Q.kind==='sec'){
    prev = p.stars[Q.id]||0;
    if(st>prev){ coinsGot = st-prev; p.stars[Q.id]=st; }
    const {u,s} = findSec(Q.id);
    if(st>=1 && prev===0) award = `<div class="award"><span class="lbl">得到新徽章</span>${medalSVG(s.icon,u.color,st)}<b>${esc(s.name)}</b></div>`;
    else if(st>prev) award = `<div class="award"><span class="lbl">徽章升級</span>${medalSVG(s.icon,u.color,st)}<b>${esc(s.name)} ${'★'.repeat(st)}</b></div>`;
  } else {
    prev = p.boss[Q.id]||0;
    if(st>prev){ coinsGot = st-prev; p.boss[Q.id]=st; }
    if(st>=2 && prev<2){
      coinsGot += 5;
      const fid = BOSS_FIG[Q.id];
      p.figs[fid] = (p.figs[fid]||0)+1;
      award = `<div class="award"><span class="lbl">傳說公仔到手</span>${figSVG(fid)}<b>${FIGS[fid].n}</b><small>${FIGS[fid].note}</small></div>`;
    }
  }
  p.coins += coinsGot; saveAll();
  const pass = Q.kind==='sec' ? st>=1 : st>=2;
  if(pass){ beep('win'); confetti(st>=3?200:110); }
  const nextSec = (()=>{ if(Q.kind!=='sec') return null; const u=UNITS.find(x=>x.id===Q.unit); return allSecs(u).find(s=>!(p.stars[s.id]>=1)); })();
  const u = UNITS.find(x=>x.id===Q.unit);
  const bossReady = Q.kind==='sec' && u && unitDone(u) && !(p.boss[u.id]>=2);
  const title = Q.kind==='boss'
    ? (pass?`打敗${Q.boss.name}了！`:`${Q.boss.name}還在…再挑戰一次！`)
    : (st===3?'全對！太強了！':pass?'過關！':'再複習一下，你可以的！');
  app.innerHTML = topbar(Q.title, '地圖') + `<div class="wrap result">
    <h2>${title}</h2>
    <div class="bigstars">${[0,1,2].map(k=>`<span class="${k<st?'on':''}">★</span>`).join('')}</div>
    <p style="font-size:1.3rem">答對 <b>${Q.right}</b> / ${n} 題</p>
    ${coinsGot?`<p class="coins-earn">🪙 獲得 ${coinsGot} 枚扭蛋幣！</p>`:''}
    ${award}
    ${!pass?`<p style="color:var(--muted)">${Q.kind==='sec'?`答對 ${Math.ceil(n*0.6)} 題就能拿到徽章。先回去看看重點卡吧！`:`答對 ${Math.ceil(n*0.8)} 題才能打敗魔王。看看下面錯的題目，再試一次！`}</p>`:''}
    <div class="row center">
      ${Q.kind==='sec'?`<button class="btn ghost" id="cards">再看重點卡</button>`:''}
      <button class="btn ghost" id="again">再挑戰一次</button>
      ${bossReady?`<button class="btn gold" id="toBoss">⚔️ 挑戰魔王</button>`:nextSec&&pass?`<button class="btn" id="nextSec">下一關：${esc(nextSec.name)} →</button>`:`<button class="btn" id="home">回地圖</button>`}
      ${p.coins>=SPIN_COST?`<button class="btn gold" id="spin">🪙 去轉扭蛋</button>`:''}
    </div>
    ${Q.wrong.length?`<div class="review"><h3>📒 錯題本（${Q.wrong.length} 題）</h3>${Q.wrong.map(w=>`<div class="ritem"><p>${esc(w.q)}</p><p class="ans">✔ ${esc(w.a)}</p>${w.e?`<p>${esc(w.e)}</p>`:''}</div>`).join('')}</div>`:''}
  </div>`;
  bindTop(viewMap);
  const g = id => document.getElementById(id);
  if(g('cards')) g('cards').onclick = ()=>viewCards(Q.id,0);
  g('again').onclick = ()=>{ if(Q.kind==='sec'){ const {s}=findSec(Q.id); startQuiz({kind:'sec', id:Q.id, unit:Q.unit, qs:pickQs(s.quiz,5), title:Q.title}); } else startBoss(Q.id); };
  if(g('toBoss')) g('toBoss').onclick = ()=>startBoss(u.id);
  if(g('nextSec')) g('nextSec').onclick = ()=>viewCards(nextSec.id,0);
  if(g('home')) g('home').onclick = viewMap;
  if(g('spin')) g('spin').onclick = viewGacha;
}
